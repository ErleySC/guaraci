name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Escopo minimo explicito: sem isto o workflow herda o padrao do
# repositorio, que pode conceder write ao GITHUB_TOKEN sem necessidade.
permissions:
  contents: read

jobs:
  # ── Lint estático (rápido, falha cedo antes de rodar a suíte pesada) ───────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (lint)
        run: ruff check --output-format=github .

  # ── Type-check dos módulos de cálculo puro ────────────────────────────────
  # Escopo estreito de propósito (ver [tool.mypy] em pyproject.toml): só os
  # módulos sem I/O/UI/estado global. Rodar mypy na base inteira geraria ruído
  # de bibliotecas sem stub (streamlit, rich) sem pegar bug de cálculo.
  # Ao criar um módulo puro novo, adicionar à lista abaixo.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install mypy + deps de tipo
        run: pip install mypy numpy scipy scikit-learn

      - name: Mypy (módulos puros)
        run: |
          mypy \
            src/guaraci/preprocessamento.py \
            src/guaraci/chemometric_stats.py \
            src/guaraci/classificadores.py \
            src/guaraci/validacao_estatistica.py \
            src/guaraci/modos_analise.py \
            src/guaraci/design_tokens.py \
            src/guaraci/resumo_parse.py \
            src/guaraci/transferencia_calibracao.py \
            src/guaraci/linearity.py \
            src/guaraci/robustness.py \
            src/guaraci/conformal.py \
            src/guaraci/config.py \
            src/guaraci/plano_amostral.py \
            src/guaraci/selecao_variaveis.py \
            src/guaraci/sentinela_deriva.py \
            src/guaraci/predicao.py \
            src/guaraci/io_registry.py \
            src/guaraci/config_io.py \
            src/guaraci/perfil_matriz.py \
            src/guaraci/plano_coleta.py \
            src/guaraci/paleta_cores.py \
            src/guaraci/auditoria_delineamento.py \
            src/guaraci/identificacao.py \
            src/guaraci/model_registry.py
            src/guaraci/technique_registry.py

  # ── Testes + cobertura ────────────────────────────────────────────────────
  # Matriz cruzada: o produto é Windows-first (código de encoding/console
  # específico de win32 em guaraci.py/cli_assistente.py), então validamos em
  # windows-latest além de ubuntu e macos, nas pontas da faixa suportada
  # (3.10–3.13, requires-python em pyproject.toml).
  #
  # REDUZIDA em PR (2026-08-07, cota de minutos do Actions esgotada numa
  # conta privada): o multiplicador de minutos do GitHub é 1x Linux / 2x
  # Windows / 10x macOS — a matriz cheia (10 combinações, incl. 2 macOS)
  # custava caro demais para rodar em CADA push de uma PR em iteração. Em
  # `pull_request`, roda só 3 combinações (Ubuntu 3.10/3.13 nas pontas da
  # faixa suportada + 1 Windows, sem macOS — ainda pega regressão de
  # encoding/console win32, só não a cada iteração). A matriz CHEIA (10
  # combinações, macOS incluso) só roda em `push` para master/main — ou
  # seja, uma vez por merge, não uma vez por commit de PR. Se a cota
  # voltar a sobrar, reverter é so' trocar `matrix.include` de volta pela
  # combinação de `os`+`python-version` (ver historico do arquivo).
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.11"}]') || fromJSON('[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.13"}]') }}

    defaults:
      run:
        shell: bash   # Git Bash no Windows: mesma sintaxe de comando nos 2 SOs

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # xgboost (extra [benchmark]) linka contra libomp em runtime no macOS;
      # macos-latest nao vem com o Homebrew OpenMP pre-instalado (ao contrario
      # de ubuntu/windows, onde o wheel do xgboost ja embute o equivalente).
      # Sem isso, todo teste que importa xgboost falha com dlopen "Library
      # not loaded: @rpath/libomp.dylib" -- nao e' um bug do guaraci.
      - name: Install libomp (macOS only, required by xgboost)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .[dev]   # valida o empacotamento (src/guaraci, entry point `guaraci`)

      - name: Run tests with coverage
        # Suíte completa (inclui o end-to-end 'slow'): valida a integração dos
        # módulos extraídos e dá cobertura real do caminho de execução, não só
        # das funções puras.
        # --cov-fail-under=60 é um PISO-CATRACA anti-regressão. O total local
        # (--cov=.) está em ~68% após a extração de lógica pura das UIs e do
        # núcleo (app_logic, cli_logic, resumo_parse, config_io, resultados_io);
        # 60 deixa ~8 pts de margem p/ diferenças de plataforma/versão. Suba o
        # número conforme cobrir mais UI/orquestrador.
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      # O piso de 60% acima é sobre o TOTAL do projeto — sozinho, ele deixaria
      # o núcleo científico despencar de 97% para ~70% sem falhar nada, desde
      # que a UI compensasse. Este passo é a trava que o CLAUDE.md (P4) afirma
      # existir: os 4 módulos que produzem número publicável não podem cair
      # abaixo de 95%. Usa os dados de cobertura já coletados no passo anterior.
      - name: "Gate de cobertura do núcleo científico (>= 95%)"
        run: |
          coverage report \
            --include="*/guaraci/chemometric_stats.py,*/guaraci/classificadores.py,*/guaraci/preprocessamento.py,*/guaraci/validacao_estatistica.py" \
            --fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  # ── Validacao contra dataset PUBLICO ──────────────────────────────────────
  # Separado da suite principal de proposito: depende de rede e de um
  # arquivo que NAO e' versionado (licenca de terceiro). Falha aqui = o
  # motor deixou de reproduzir a literatura, o que e' bug, nao flakiness.
  # `continue-on-error: false` -- se a fonte cair, o job falha e alguem olha,
  # em vez de virar verde silencioso.
  validacao-publica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e . && pip install pytest scipy
      - name: Baixar dataset publico (Eigenvector Corn)
        env:
          # Fixado em 2026-08-20. Sem isto, o gate de validacao publica
          # aceitaria silenciosamente qualquer conteudo que a origem servisse
          # -- e o .mat vai direto para scipy.io.loadmat.
          CORN_SHA256: e28fd4be274a54ca57b1f2c67ef5a8bf4981f8314bcc73e4c64836fe658c46b5
          CORN_BYTES: "1445616"
        run: |
          mkdir -p "$HOME/datasets_publicos"
          destino="$HOME/datasets_publicos/corn.mat"
          curl -fsSL --retry 3 -o "$destino" https://eigenvector.com/data/Corn/corn.mat
          echo "$CORN_SHA256  $destino" | sha256sum -c -
          tamanho=$(wc -c < "$destino")
          if [ "$tamanho" != "$CORN_BYTES" ]; then
            echo "corn.mat com $tamanho bytes, esperado $CORN_BYTES" >&2
            exit 1
          fi
      - name: Rodar validacao externa
        run: |
          export GUARACI_DATASETS_DIR="$HOME/datasets_publicos"
          pytest tests/test_validacao_publica.py -v

  # ── Validacao contra dataset PUBLICO Mendeley (oleos comestiveis) ─────────
  # Matriz de 3 SOs (Passo 82): download em Python (script versionado, nao
  # bash inline) para ser identico nos 3 runners. Mesma filosofia do Corn --
  # falha aqui e' bug real ou fonte fora do ar, nunca flakiness silenciada.
  validacao-publica-mendeley:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e . && pip install pytest
      - name: Baixar dataset publico (Mendeley ctgg7k4m5g)
        env:
          GUARACI_DATASETS_DIR: ${{ runner.temp }}/datasets_publicos
        run: python scripts/download_datasets/baixar_mendeley_oleos.py
      - name: Rodar validacao externa
        env:
          GUARACI_DATASETS_DIR: ${{ runner.temp }}/datasets_publicos
        run: pytest tests/test_validacao_publica_mendeley.py -v
