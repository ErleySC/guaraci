name: Draft JOSS PDF

on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch: {}

# Escopo minimo explicito: sem isto o workflow herda o padrao do
# repositorio, que pode conceder write ao GITHUB_TOKEN sem necessidade.
permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Build draft PDF
        # Pinado por SHA:  e' branch mutavel -- o conteudo da acao
        # pode mudar entre dois builds sem nenhum sinal.
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c  # master em 2026-08-20
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: paper
          path: paper/paper.pdf
