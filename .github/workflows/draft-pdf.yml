name: Draft JOSS PDF

on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch: {}

# Escopo minimo explicito: sem isto o workflow herda o padrao do
# repositorio, que pode conceder write ao GITHUB_TOKEN sem necessidade.
permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
