# Perfil de tecnica de imagem: camera de bancada / controle de laboratorio
# (iluminacao e enquadramento fixos, camera montada, distancia constante).
descricao: "Colorimetria digital via camera de bancada (aquisicao controlada)"
unidade_eixo: "indice"
default_preprocessing: "autoscaling"
vocabulario:
  classe: "classe"
  classe_plural: "classes"
  matriz: "a amostra fotografada"
  alvo: "o teor do analito de interesse"
  conforme: "conforme"
  nao_conforme: "nao conforme"
codigos_classe: {}
faixa_trabalho: null
referencia: ""
resolucao_esperada: "1024x768 ou superior"
formatos_aceitos: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
