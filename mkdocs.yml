site_name: GUARACI
site_description: Plataforma de quimiometria multitécnica, aberta e reprodutível
site_url: https://ErleySC.github.io/guaraci/
repo_url: https://github.com/ErleySC/guaraci
repo_name: ErleySC/guaraci

docs_dir: docs
site_dir: site

# O site publica a documentacao de USO, a cientifica e a de contribuicao; o resto fica so' no repositorio.
# MANUAL.md, CHANGELOG.md e SECURITY.md vivem na raiz e sao copiados para docs/ pelo job de docs.
exclude_docs: |
  projeto/
  usuario/
  qualidade/
  POLITICA_DE_DOCUMENTACAO.md
  *.yaml

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Início: index.md
  - Manual:
      - Manual completo: MANUAL.md
  - Documentação científica:
      - Validação numérica: cientifico/validacao_numerica.md
      - Limitações conhecidas: cientifico/limitacoes.md
      - Referências no código: cientifico/glossario_referencias_no_codigo.md
  - Contribuir:
      - Arquitetura: contribuir/arquitetura.md
      - Compatibilidade da API: contribuir/compatibilidade_da_api.md
  - Segurança: SECURITY.md
  - Changelog: CHANGELOG.md
  - Referência da API (núcleo científico):
      - chemometric_stats: api/chemometric_stats.md
      - classificadores: api/classificadores.md
      - preprocessamento: api/preprocessamento.md
      - validacao_estatistica: api/validacao_estatistica.md
      - selecao_variaveis: api/selecao_variaveis.md
      - predicao: api/predicao.md

validation:
  links:
    # Documentos linkam arquivos do repositório fora de docs_dir (código, README) -- links
    # reais e corretos no GitHub, só não resolvidos pelo build local do site.
    not_found: ignore

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
